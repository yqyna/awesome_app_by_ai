[project]
name = "awesome-app-backend"
version = "0.1.0"
description = "FastAPI backend with Django-inspired architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
]

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000
reload = true
